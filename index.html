<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poltawski+Nowy:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/header.css" />

    <title>Aaron Store</title>
  </head>

  <body>
    <header>
      <div class="container-header">
        <section class="logo">
          <img
            src="icons/montanhas.png"
            alt="Aaron-Store"
            class="aaron-image"
          />
        </section>

        <div class="nav-container">
          <nav>
            <ul>
              <li>
                <a href="about.html">About us</a>
              </li>
              <li>
                <a href="index.html#best-sellers-section">Best Sellers</a>
              </li>
              <li>
                <a href="index.html#newsletter-section">News</a>
              </li>
              <li>
                <a href="index.html#contact-section">Contact</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>

      <div class="container"></div>
    </header>

    <main>
      <div class="container-title">
        <h1 class="main-title">Welcome to Aaron Store</h1>
        <p class="main-description">find a product</p>
      </div>

      <div class="container-cards">
        <section class="cards" id="jersey">
          <div class="card col-md-3">
            <img
              src="catalogo/Denver_broncos_Jersey_Sutton.jpeg"
              alt="Denver Broncos Jersey Sutton"
              class="card-image"
            />
            <h3>Denver Broncos Jersey</h3>
            <p class="card-description">Sutton</p>
            <p class="card-price">R$ 299,99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2026 Aaron Store. All rights reserved.</p>
      </div>
    </footer>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/products.js"></script>

  </body>
</html>
