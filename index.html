<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="images/icons/psyduck.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poltawski+Nowy:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    
    <link rel="stylesheet" href="css/styles.css" />

    <title>Psyduck Store</title>
  </head>

  <body>
    <header>
      <section class="container-header">
        <div class="nav-container">
          <nav>
            <ul>
              <li>
                <a href="about.html">About us</a>
              </li>
              <li>
                <a href="index.html#best-sellers-section">Best Sellers</a>
              </li>
              <li>
                <a href="index.html#newsletter-section">News</a>
              </li>
              <li>
                <a href="index.html#contact-section">Contact</a>
              </li>
            </ul>
          </nav>
        </div>
      </section>
    </header>

    <section class="text-section">
      <div id="text-container" class="row">
        <div id="text-content" class="col-md-12">
          <h1>Welcome to Psyduck Store</h1>
          <p>The best sports products are here.</p>
        </div>
      </div>
    </section>

    <div id="app">
    <div class="catalogo d-flex flex-wrap gap-3 justify-content-center">
      <div class="card" v-for="produto in produtos" :key="produto.name">
        <img :src="produto.image" :alt="produto.name">
        <h3>{{ formatarNome(produto.name) }}</h3>
        <p>{{ produto.team }} · {{ produto.category }}</p>
        <p class="preco">{{ formatarPreco(produto.price) }}</p>
        <a href="#" class="btn btn-secondary">buy now</a>
        <a href="#" class="btn btn-secondary">add to cart</a>
      </div>
    </div>



    <footer>
      <div class="container">
        <p>&copy; 2026 Psyduck Store. All rights reserved.</p>
      </div>
    </footer>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    
    <script src="scripts/main.js"></script>
  </body>
</html>
